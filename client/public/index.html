<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroArcade Spades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="tableCall" class="table-call hidden" aria-live="polite"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">RetroArcade</p>
          <h1>Spades Online</h1>
        </div>
        <div class="header-actions">
          <button id="soundToggle" type="button" class="sound-toggle" data-sound-toggle aria-pressed="true">Sound test</button>
          <div id="statusBadge" class="status-badge">Offline</div>
        </div>
      </header>

      <main class="content">
        <section id="lobby" class="panel active">
          <h2>Create or join a table</h2>

          <div class="auth-row">
            <label>
              Your name
              <input id="playerName" type="text" value="Player 1" maxlength="20" />
            </label>

            <label>
              Stake
              <select id="stakeSelect">
                <option value="250">250</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
              </select>
            </label>

            <label>
              Table style
              <select id="tableStyleSelect">
                <option value="green">Green felt</option>
                <option value="red">Red velvet</option>
                <option value="midnight">Midnight noir</option>
              </select>
            </label>
          </div>

          <div class="button-row">
            <button id="createRoomBtn">Create room</button>
            <div class="join-group">
              <input id="roomCodeInput" type="text" maxlength="5" placeholder="ROOM CODE" />
              <button id="joinRoomBtn" class="secondary">Join</button>
            </div>
          </div>

          <div id="errorBox" class="error-box hidden"></div>
        </section>

        <section id="table" class="panel">
          <div class="game-client">
            <div class="table-hud">
              <div class="room-share">
                <p class="eyebrow">Room</p>
                <h3 id="roomCodeLabel">&mdash;</h3>
                <button id="copyInviteBtn" type="button" class="invite-btn">Copy invite link</button>
              </div>

              <div class="table-scoreboard">
                <div class="score-box">
                  <span class="score-label">Team 1</span>
                  <strong id="teamOneScore">0</strong>
                </div>
                <div class="score-box center-box">
                  <span class="score-label">Left</span>
                  <strong id="handMeterValue">13</strong>
                </div>
                <div class="score-box">
                  <span class="score-label">Team 2</span>
                  <strong id="teamTwoScore">0</strong>
                </div>
              </div>

              <div class="hud-actions">
                <div class="stake-chip">
                  <span>Stake</span>
                  <strong id="stakeLabel">250</strong>
                </div>
                <button id="gameSoundToggle" type="button" class="sound-toggle game-sound-toggle" data-sound-toggle aria-pressed="true">Sound test</button>
                <button id="startGameBtn" class="primary">Start game</button>
              </div>
            </div>

            <div class="hand-meter-shell" aria-hidden="true">
              <div class="hand-meter-track">
                <div id="handMeterFill" class="hand-meter-fill"></div>
              </div>
            </div>

            <div class="casino-stage">
              <div class="table-rail">
                <div class="table-felt">
                  <div class="table-glow"></div>

                  <div class="table-message">
                    <p id="gameMessage">Waiting for players.</p>
                    <span>Turn: <strong id="turnLabel">&mdash;</strong></span>
                  </div>

                  <div class="table-pit" aria-label="Cards in play">
                    <div id="trickNorth" class="trick-slot north"></div>
                    <div id="trickEast" class="trick-slot east"></div>
                    <div id="trickSouth" class="trick-slot south"></div>
                    <div id="trickWest" class="trick-slot west"></div>
                    <div class="pot-box">
                      <span>POT</span>
                      <strong id="potValue">$250</strong>
                    </div>
                  </div>

                  <div class="chip-panel" aria-label="Chips panel">
                    <div class="chip-stack chip-stack-red"><span>250</span></div>
                    <div class="chip-stack chip-stack-gold"><span>500</span></div>
                    <div class="chip-stack chip-stack-blue"><span>1000</span></div>
                  </div>

                  <div id="tableSeats" class="table-seats"></div>
                </div>
              </div>

              <div class="bid-row">
                <label for="bidSelect">Bid</label>
                <select id="bidSelect">
                  <option value="0">Nil</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                  <option value="7">7</option>
                  <option value="8">8</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                </select>
                <button id="bidBtn" type="button" class="secondary">Submit bid</button>
              </div>

              <div class="hand-dock">
                <div id="handArea" class="hand-area"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/sounds.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
